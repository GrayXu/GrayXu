[metadata]
name = token-heatmap
version = 0.1.0
description = Aggregate ccusage and CPA token usage into a GitHub README heatmap

[options]
package_dir =
    = src
packages = find:
python_requires = >=3.9

[options.packages.find]
where = src

[options.entry_points]
console_scripts =
    token-heatmap = token_heatmap.app:main
